[project]
name = "learning-py"
version = "0.1.0"
description = "Python 学习与实验代码（与 java/ 子项目并列，使用 uv 管理）"
readme = "README.md"
authors = [
    { name = "zevli", email = "zevli@tencent.com" }
]
requires-python = ">=3.11"
dependencies = [
    "openai>=2.34.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
learning-py = "learning_py:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
# 让 Pylance / pyright 用项目的虚拟环境，避免 "无法解析导入" 之类的误报
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["src", "tests"]
reportMissingTypeStubs = false

[tool.basedpyright]
# 工程偏好：本项目大量使用多行字符串字面量拼接 prompt，
# 也会有 Any 类型透传 LLM 返回。关掉这几条减少不必要的红线噪音。
include = ["src", "tests"]
# src-layout：让 basedpyright 找到 src/ 下的包
extraPaths = ["src"]
reportImplicitStringConcatenation = false
# src-layout 里用 `from learning_py.xxx import ...` 是规范写法，
# 但 basedpyright 看到当前文件不在顶层包路径里就会误判为隐式相对导入。
reportImplicitRelativeImport = false
reportAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
