[project]
name = "learning-py"
version = "0.1.0"
description = "Python 学习与实验代码（与 java/ 子项目并列，使用 uv 管理）"
readme = "README.md"
authors = [
    { name = "zevli", email = "zevli@tencent.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learning-py = "learning_py:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
