[project]
name = "learning-py"
version = "0.1.0"
description = "Python 学习与实验代码（与 java/ 子项目并列，使用 uv 管理）"
readme = "README.md"
authors = [
    { name = "zevli", email = "zevli@tencent.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.17",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "mcp>=1.27.1",
    "openai>=2.34.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
]
langsmith-extra = [
    "langsmith>=0.8.0",
]
observability = [
    "learning-py[otel,langsmith-extra]",
]

[project.scripts]
learning-py = "learning_py:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

# 类型检查器（pyright / basedpyright / Pylance）统一读根目录下的
# `pyrightconfig.json`。放在那里的理由：
# 1. basedpyright 优先读 pyrightconfig.json，忽略 pyproject.toml 里的配置段
# 2. 单独文件带 JSONC 注释更可读
# 3. 和官方 pyright / VSCode Pylance 的行为一致
